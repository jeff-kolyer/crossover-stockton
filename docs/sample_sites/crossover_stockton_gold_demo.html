    function inspectRecordById(id) {
      const rec = EXPLORER_RECORDS.find(r => r.id === id);
      if (!rec) return;

      document.getElementById('rec-modal-id').textContent = `${rec.id} · ${rec.type}`;
      const statusEl = document.getElementById('rec-modal-status');
      statusEl.textContent = rec.status;
      statusEl.className = `font-mono text-[10px] font-semibold uppercase px-2 py-0.5 rounded-md border ${getStatusBadgeClass(rec.status)}`;

      document.getElementById('rec-modal-body').innerHTML = `
        <h3 class="font-serif text-2xl font-bold text-[#13161C] leading-snug">${rec.title}</h3>
        <div class="p-3.5 rounded-xl bg-[#F7F6F2] border editorial-rule space-y-1 text-xs">
          <div><strong class="text-[#13161C]">Date Indexed:</strong> <span class="font-mono text-[#505662]">${rec.date}</span></div>
          <div><strong class="text-[#13161C]">Source / Provenance:</strong> <span class="text-[#505662]">${rec.source}</span></div>
        </div>
        <p class="text-sm text-[#13161C] leading-relaxed">${rec.summary}</p>
      `;

      const footerEl = document.getElementById('rec-modal-footer');
      if (rec.articleId) {
        footerEl.innerHTML = `
          <button onclick="closeRecordModal()" class="px-3.5 py-2 rounded-xl bg-white border editorial-rule text-xs font-semibold text-[#505662] cursor-pointer">Close</button>
          <button onclick="closeRecordModal(); navigateTo('articles', '${rec.articleId}')" class="px-4 py-2 rounded-xl bg-[#1D4ED8] text-white text-xs font-semibold cursor-pointer">
            Read Linked Article →
          </button>
        `;
      } else {
        footerEl.innerHTML = `
          <span class="font-mono text-[11px] text-[#505662]">Verified Archive Entry</span>
          <button onclick="closeRecordModal()" class="px-4 py-2 rounded-xl bg-[#13161C] text-white text-xs font-semibold cursor-pointer">Done</button>
        `;
      }

      const modal = document.getElementById('record-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeRecordModal() {
      const modal = document.getElementById('record-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Single-Purpose Full-Screen Map Controls
    let mapZoom = 1;
    let mapPanX = 0;
    let mapPanY = 0;
    let isDraggingMap = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function openFullScreenMap(mapKey) {
      const mapObj = ARTICLE_MAPS[mapKey];
      if (!mapObj) return;

      document.getElementById('fs-map-title').textContent = mapObj.title;
      document.getElementById('fs-map-subtitle').textContent = mapObj.subtitle;
      document.getElementById('fs-map-transform-layer').innerHTML = mapObj.svg;
      document.getElementById('fs-map-legend').innerHTML = mapObj.legend;

      resetMapTransform();
      const modal = document.getElementById('fullscreen-map-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeFullScreenMap() {
      const modal = document.getElementById('fullscreen-map-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function applyMapTransform() {
      const layer = document.getElementById('fs-map-transform-layer');
      layer.style.transform = `translate(${mapPanX}px, ${mapPanY}px) scale(${mapZoom})`;
    }

    function adjustMapZoom(delta) {
      mapZoom = Math.min(2.4, Math.max(0.7, +(mapZoom + delta).toFixed(2)));
      applyMapTransform();
    }

    function resetMapTransform() {
      mapZoom = 1;
      mapPanX = 0;
      mapPanY = 0;
      applyMapTransform();
    }

    // Panning listeners for Full-Screen Map
    const mapViewport = document.getElementById('fs-map-viewport');
    mapViewport.addEventListener('mousedown', e => {
      isDraggingMap = true;
      dragStartX = e.clientX - mapPanX;
      dragStartY = e.clientY - mapPanY;
    });
    window.addEventListener('mousemove', e => {
      if (!isDraggingMap) return;
      mapPanX = e.clientX - dragStartX;
      mapPanY = e.clientY - dragStartY;
      applyMapTransform();
    });
    window.addEventListener('mouseup', () => {
      isDraggingMap = false;
    });

    mapViewport.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDraggingMap = true;
        dragStartX = e.touches[0].clientX - mapPanX;
        dragStartY = e.touches[0].clientY - mapPanY;
      }
    }, { passive: true });
    mapViewport.addEventListener('touchmove', e => {
      if (!isDraggingMap || e.touches.length !== 1) return;
      mapPanX = e.touches[0].clientX - dragStartX;
      mapPanY = e.touches[0].clientY - dragStartY;
      applyMapTransform();
    }, { passive: true });
    mapViewport.addEventListener('touchend', () => {
      isDraggingMap = false;
    });

    // Global backdrop & Escape key handlers
    document.getElementById('record-modal').addEventListener('click', e => {
      if (e.target.id === 'record-modal') closeRecordModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeRecordModal();
        closeFullScreenMap();
      }
    });

    // Boot application
    window.onload = function () {
      updateNavHighlight();
      renderCurrentView();
    };
  </script>
</body>
</html>
