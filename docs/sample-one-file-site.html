 on October 19 the Council Legislation and Environmental Committee advanced proposed changes addressing repeated roaming violations and a conditional fourth household dog or cat. Animal Services also described regular shelter capacity pressure, appointments for healthy stray intake, priority for sick, injured, aggressive, and confirmed abandonment cases, and a temporary found-animal foster pathway. These are reported practices and proposals; the ordinance still requires full City Council consideration before taking effect. For Dogs in Stockton, the report raises questions about how roaming dogs are classified, what happens after an intake request, and whether temporary care leads to verified outcomes. We are following Council action, foster eligibility and outcomes, and the pending field-call records request. The first street observation remains to be documented.","fields":{"id":"stocktonia-2026-10-20-animal-control-proposals","title":"Committee advances proposed animal-control changes amid shelter overcrowding","summary":"Stocktonia reports that on October 19 the Council Legislation and Environmental Committee advanced proposed changes addressing repeated roaming violations and a conditional fourth household dog or cat. Animal Services also described regular shelter capacity pressure, appointments for healthy stray intake, priority for sick, injured, aggressive, and confirmed abandonment cases, and a temporary found-animal foster pathway. These are reported practices and proposals; the ordinance still requires full City Council consideration before taking effect. For Dogs in Stockton, the report raises questions about how roaming dogs are classified, what happens after an intake request, and whether temporary care leads to verified outcomes. We are following Council action, foster eligibility and outcomes, and the pending field-call records request. The first street observation remains to be documented.","record_type":"planning_update","trust":"source_supported","e ace.","body":"Volunteers moved frozen meat, produce, bread, and other groceries directly to residents through drive-through and walk-up lines, with local partners helping provide refrigerated transportation and temporary storage.","sign_of_being":"Food that exceeded one organization’s storage capacity was moved through a local network and reached families instead of being lost.","published_at":"2026-08-06","source_label":"Stocktonia","source_url":"https://stocktonia.org/news/uncategorized/2026/08/06/it-helps-a-lot-of-people-bread-of-life-brings-truckloads-of-donated-food-to-stockton-families/","gap_ids":["food-distribution-capacity"],"organization_ids":["bread-of-life"],"active":true,"preferred_image":"/images/connection/food_bank.jpg"},"dateForSort":{"field":"published_at","value":"2026-08-06"}},"cats-transferred-out-of-overcrowding":{"id":"cats-transferred-out-of-overcrowding","schema":"story","typeName":"Story","title":"34 cats moved out of overcrowding.","description":"Thirty-four cats and kittens were transferred from Stockton to the San Diego Humane Society during a period of severe local animal overcrowding.","fields":{"id":"cats-transferred-out-of-overcrowding","title":"34 cats moved out of overcrowding.","summary":"Thirty-four cats and kittens were transferred from Stockton to the San Diego Humane Society during a period of severe local animal overcrowding.","body":"The transfer is a concrete example of organizations crossing geographic boundaries to create placement capacity when the local system is strained.","sign_of_being":"Thirty-four animals moved from a system without enough room into one with capacity to care for them.","published_at":"2026-05-05","source_label":"Stocktonia","source_url":"https://stocktonia.org/news/local-government/2026/05/05/san-joaquin-county-spay-neuter-shelter-pets/","gap_ids":["dogs-safe-placement"],"organization_ids":["hard-luck-awa"],"active":true,"preferred_image":"/images/connection/cat_overcrowding.jpg"},"dateForSort":{"field":"published_at","value":"2026-05-05"}},"prison-puppy-program":{"id":"prison-puppy-program","schema":"story","typeName":"Story","title":"A prison puppy program keeps changing lives.","description":"At California Health Care Facility in Stockton, incarcerated handlers help raise future service dogs while practicing responsibility, patience, service, and connection.","fields":{"id":"prison-puppy-program","title":"A prison puppy program keeps changing lives.","summary":"At California Health Care Facility in Stockton, incarcerated handlers help raise future service dogs while practicing responsibility, patience, service, and connection.","body":"Canine Companions’ Stockton prison puppy-raising work is a supporting reentry pathway rather than a housing program: handlers care for and train future service dogs, contributing to another person’s independence while building purpose and responsibility before release.","sign_of_being":"A person living inside a prison is helping prepare another living being to give someone else greater independence.","published_at":"2026-08-20","source_label":"Canine Companions","source_url":"https://canine.org/wp-content/uploads/2025/06/CC25_AnnualReport2024-lists-ADA.pdf","gap_ids":["reentry-housing-instability"],"organization_ids":[],"active":true,"preferred_image":"/images/connection/prison_puppy.jpg"},"dateForSort":{"field":"published_at","value":"2026-08-20"}},"pathways-opened-268-beds":{"id":"pathways-opened-268-beds","schema":"story","typeName":"Story","title":"Pathways opened with 268 beds.","description":"St. Mary’s Community Services opened Pathways Neighborhood, adding modular transitional housing and on-site support for people moving out of homelessness.","fields":{"id":"pathways-opened-268-beds","title":"Pathways opened with 268 beds.","summary":"St. Mary’s Community Services opened Pathways Neighborhood, adding modular transitional housing and on-site support for people moving out of homelessness.","body":"The opening is a concrete sign that Stockton’s low-barrier housing pathway is gaining capacity: private modular housing is paired with supportive services intended to help residents transition toward permanent housing.","sign_of_being":"New physical space became a real pathway out of homelessness when housing and support were created together.","published_at":"2026-06-23","source_label":"The Stockton Record","source_url":"https://bluewaterhealthyliving.com/news/national-news/california/st-marys-community-services-holds-pathways-neighborhood-open-house/","gap_ids":["low-barrier-housing-pathways","pet-inclusive-shelter"],"organization_ids":["st-marys-dining-room"],"active":true,"preferred_image":"/images/connection/pathways-neighborhood.jpg"},"dateForSort":{"field":"published_at","value":"2026-06-23"}},"floyd-henley-apartment":{"id":"floyd-henley-apartment","schema":"story","typeName":"Story","title":"Floyd got the keys to his own apartment.","description":"After decades of incarceration, Floyd Henley moved into a Stockton apartment with housing and rental support from Friends Outside while continuing college coursework and employment.","fields":{"id":"floyd-henley-apartment","title":"Floyd got the keys to his own apartment.","summary":"After decades of incarceration, Floyd Henley moved into a Stockton apartment with housing and rental support from Friends Outside while continuing college coursework and employment.","body":"Stocktonia documented Henley receiving the keys to his apartment, picking up furniture and supplies through Friends Outside, continuing his education, and working at a Stockton steel company. The outcome shows several parts of reentry coming together in one life: housing, work, education, and practical support.","sign_of_being":"A person returning from decades of incarceration reached a home of his own while continuing work and education with local support.","published_at":"2026-09-13","source_label":"Stocktonia","source_url":"https://stocktonia.org/news/public-safety/justice/2026/09/13/life-after-lockup-for-the-formerly-incarcerated-a-long-rebuilding-process/","gap_ids":["reentry-housing-instability"],"organization_ids":["friends-outside"],"active":true,"preferred_image":"/images/connection/gets-apartment-keys.jpg"},"dateForSort":{"field":"published_at","value":"2026-09-13"}},"friction-of-volunteering":{"id":"friction-of-volunteering","schema":"article","typeName":"Article","title":"The friction of volunteering","description":"We applied to volunteer with two animal-care organizations. What happens between offering help and actually providing it?","fields":{"id":"friction-of-volunteering","title":"The friction of volunteering","description":"Crossover's volunteer applications in Stockton raise a practical question: how could better coordination help willingness to care become action?","summary":"We applied to volunteer with two animal-care organizations. What happens between offering help and actually providing it?","date":"2026-10-30","type":"investigation","path":"/articles/friction-of-volunteering/","content":{"introduction":"Wanting to help a dog is only the beginning. A person has to find an opportunity, connect with an organization, complete its requirements, and reach a task they can safely do. Crossover's attempts to volunteer in Stockton give us a starting point for investigating that path.","sections":[{"heading":"Two attempts to take part","paragraphs":["Crossover submitted a volunteer application to Stockton Street Dogs on October 7, 2026. We had not documented a response as of October 30. We emailed Stockton Animal Services about its Doggie Day Out program on October 12 and submitted a volunteer application in person on October 14. We had not documented a substantive next step by October 30.","These are our firsthand records of two volunteer pathways, not evidence that either organization routinely fails to respond. We do not know what happened to the applications internally or why participation has not progressed. Stockton Animal Services publicly describes volunteer roles and a Doggie Day Out orientation; Stockton Street Dogs also offers a public volunteer entry point. We want to understand what happens after someone uses those entry points."],"links":[{"label":"Street Dogs application Activity record","display_label":"Street Dogs application","url":"/work/dogs/activity/#crossover-2026-10-07-street-dogs-volunteer-application"},{"label":"Doggie Day Out inquiry Activity record","display_label":"Doggie Day Out inquiry","url":"/work/dogs/activity/#crossover-2026-10-12-doggie-day-out-inquiry"},{"label":"Animal Services application Activity record","display_label":"Animal Services application","url":"/work/dogs/activity/#crossover-2026-10-14-sas-volunteer-application"},{"label":"Stockton Animal Services volunteer information","display_label":"Animal Services volunteering","url":"https://www.stocktonca.gov/services/animal_services/volunteer.php"},{"label":"Stockton Street Dogs volunteer link","display_label":"Street Dogs volunteering","url":"https://linktr.ee/streetdogsanctuary"}]},{"heading":"Where willingness can meet friction","paragraphs":["A prospective volunteer finds an organization, applies, and waits to learn the next step. Orientation, training, screening, scheduling, and approval may follow. Some requirements protect animals, volunteers, and the organization and should remain. The question is which parts require human judgment and which repetitive steps could be made easier to understand and complete.","Shelters and rescues are already caring for animals while managing facilities, emergencies, communication, and existing volunteers. Administrative work can consume the same time that could support a new helper. We have not measured these workloads in Stockton or established where any particular application stalled. That is what we need to investigate."]},{"heading":"What business already knows","paragraphs":["In business, interest is captured and supported. Here we're asking why that kind of smooth pathway isn't available to people who want to help dogs.","Companies have spent decades building systems that answer inquiries, track interest, follow up, schedule appointments, and help people take the next step. An offer to help an animal may still pass through applications, emails, waiting, and manual coordination. This comparison does not treat care as a sale. It asks whether the tools developed to guide commercial participation could also support people who want to care for living beings."]},{"heading":"Infrastructure that helps both sides","paragraphs":["Stockton Animal Services and Stockton Street Dogs do essential work. Better volunteer infrastructure could help their staff and existing volunteers as well as applicants. It might show which roles are open, explain requirements, acknowledge applications, provide status updates, and make it easier to schedule an appropriate next step. We do not know whether these organizations already use some of these tools or what changes they would find useful.","An AI-supported system could answer routine questions immediately, guide an applicant through forms, coordinate orientation and training, suggest tasks that fit a person's availability and abilities, and reduce repeated administrative work. These are proposals to test with organizations, not claims of a working Stockton system. Screening, animal-handling safeguards, supervision, and final decisions would stay with qualified people. The purpose is to automate the friction surrounding compassion, not compassion itself."]},{"heading":"More room for vocation","paragraphs":["Today's systems devote substantial effort to making commercial participation easy. AI and automation may make similar coordination tools more accessible to community organizations without requiring large administrative teams. Whether that promise holds for Stockton's animal-care work remains to be tested.","People would still provide attention, judgment, relationships, and direct care. Technology could make it simpler for them to contribute. This is one practical part of Crossover's broader investigation into using new capabilities to free more human time for meaningful work and care."]},{"heading":"Questions for the next step","paragraphs":["How do these organizations receive and manage volunteer applications? What determines response time, and where do applicants commonly get stuck? Which administrative tasks consume staff and volunteer time? Which steps need human judgment, and which could be simplified? Could organizations share coordination tools while retaining their independence? We need answers from the people doing this work before proposing a specific system.","We've built extraordinary systems for turning interest into purchases. We should be able to build equally effective systems for turning compassion into care."]}]},"related_gap_ids":["dogs-safe-placement"],"related_location_ids":["stockton-animal-services-shelter"],"published":true,"related_finding_ids":["finding-volunteer-onboarding-can-stall"]},"dateForSort":{"field":"date","value":"2026-10-30"}},"public-access-to-stray-dog-information":{"id":"public-access-to-stray-dog-information","schema":"article","typeName":"Article","title":"Public access to stray dog information in Stockton","description":"Public reporting and shelter information exist. Can people also learn what happened after a stray dog was reported and where help is still needed?","fields":{"id":"public-access-to-stray-dog-information","title":"Public access to stray dog information in Stockton","description":"An investigation into which information about Stockton's stray dogs is public, what remains difficult to trace, and how better coordination could help.","summary":"Public reporting and shelter information exist. Can people also learn what happened after a stray dog was reported and where help is still needed?","date":"2026-10-30","type":"investigation","path":"/articles/public-access-to-stray-dog-information/","content":{"introduction":"When someone reports a dog on Stockton's streets, what information reaches the people who could help? Stockton Animal Services, independent rescuers, volunteers, and residents already respond in different ways. We are investigating whether useful information about reported dogs, responses, and unresolved needs is accessible enough to support that work.","sections":[{"heading":"Our October 20 records request","paragraphs":["On October 20, Crossover requested approximately 12 months of Stockton Animal Services field-call records involving roaming, stray, abandoned, aggressive, and distressed dogs. We asked for dates, general areas, complaint categories, response dispositions, and closure statuses where those fields are maintained. The request is intended to help us learn where dogs are reported, whether officers respond and locate them, what follows a response, and which reports remain unresolved. We do not yet know which of these questions the records can answer.","As of October 30, ten calendar days after submission, Crossover had received an automatic forwarding acknowledgment but no substantive response or records. This status was confirmed by the requester on October 30. California's Public Records Act generally calls for an agency to make a disclosure determination within ten calendar days, with qualifying extensions; that is not necessarily a deadline for delivering the records. We have not established the agency's receipt date, any applicable extension, or the full circumstances of its processing, so we are drawing no legal conclusion from this timeline."],"links":[{"label":"Crossover's records-request Activity record","display_label":"Animal Services records request","url":"/work/dogs/activity/#crossover-2026-10-20-sas-field-call-records-request"},{"label":"California Department of Justice guide to public records timelines","display_label":"California records timelines guide","url":"https://oag.ca.gov/consumers/general/pra"}]},{"heading":"What the public can already see","paragraphs":["The City provides an online route for animal-related complaints, a list of pets currently in shelter care, and a lost-and-found pet map. Stockton's open-data portal also publishes an animal-shelter overview of intake and outcomes. These are useful public resources. A shelter intake or outcome total, however, is different from a record of each street report and what happened afterward.","Our question is whether a person can follow the path from a reported dog to an officer response, a located animal, care, reunification, placement, or an unresolved case. We have not established that this information is unavailable elsewhere. We need to examine the requested records, the limits of the public tools, and what can be shared safely before concluding that a gap exists."],"links":[{"label":"Stockton Animal Services complaint guidance","display_label":"Animal Services complaint guidance","url":"https://www.stocktonca.gov/services/animal_services/animal_related_complaints.php"},{"label":"City lost-and-found pet resources","display_label":"City lost-and-found resources","url":"https://www.stocktonca.gov/services/animal_services/lost___found_pets.php"},{"label":"Stockton open-data animal-shelter overview","display_label":"Stockton animal-shelter data","url":"https://data.stocktonca.gov/stories/s/Animal-Shelter/k643-feip/"}]},{"heading":"Information across organizations","paragraphs":["Animal Services is one part of the response. Stockton Street Dogs, independent rescuers, volunteers, and other groups also encounter dogs and provide care. We do not know how their internal records are kept or how they share information. Public access is a separate question: can a resident identify a current need and a safe way to help without relying on an outdated post or an uncertain contact route?","Crossover applied to volunteer with Stockton Street Dogs on October 7. We had not documented a response by October 30. That experience tells us about our own attempt to connect; it does not establish how the organization handles other applications or communicates internally. We want to learn which public and organizational channels already work, and where information about opportunities or outcomes is hard to find."],"links":[{"label":"Crossover's volunteer-application Activity record","display_label":"Street Dogs volunteer application","url":"/work/dogs/activity/#crossover-2026-10-07-street-dogs-volunteer-application"},{"label":"Stockton Street Dogs' public site","display_label":"Street Dogs website","url":"https://streetdogsanctuary.com/"}]},{"heading":"What better information could make possible","paragraphs":["A public, AI-supported animal-welfare information system is a possibility to test. It could organize public reports and official information, show patterns across general areas, record what happened after reports, identify unresolved needs, and connect people with verified ways to help. It could also make investigation findings easier to inspect. This would require cooperation, reliable source data, and a clear account of what each record does and does not establish.","Sensitive animal locations and personal information should be protected. Reported sightings must remain distinct from verified conditions and confirmed outcomes. AI could help sort and summarize information, but people would need to check its work and make care decisions. We have not built or validated such a system for Stockton."]},{"heading":"How Crossover is testing the approach","paragraphs":["Crossover's public investigation follows a cycle: Tasks identify what needs checking; Activity records what happened; Findings explain what the evidence supports; new Actions follow from what we learn. Anyone can inspect those pages without creating an account. The records request is one Activity in that cycle, and its result remains pending.","This is an emerging way to make our own work inspectable, not a claim that we have solved coordination across organizations. The next steps are to examine the field-call records if provided, compare them with existing public resources, ask responders what information they can share, and test whether that information helps people act safely."],"links":[{"label":"Investigation Tasks","url":"/work/dogs/tasks/"},{"label":"Investigation Activity","url":"/work/dogs/activity/"},{"label":"Findings","url":"/work/dogs/findings/"},{"label":"Public Actions","url":"/action/"}]},{"heading":"What remains to establish","paragraphs":["We still need to learn what field-call data exists and can be released, how a public report moves through response and closure, what useful information is already public, and how Animal Services and independent caregivers coordinate when appropriate. We also need to ask whether better access would change outcomes for dogs, while respecting privacy and safety.","How could better public information and AI-supported coordination help more dogs reach care?"]}]},"related_gap_ids":["dogs-safe-placement"],"related_location_ids":["stockton-animal-services-shelter","weston-ranch-carrie-street","south-lincoln-crosstown","trinity-bear-creek","country-club-i5","pawboost-crown-rose-marie-2026-10-16","pawboost-california-magnolia-2026-10-15","pawboost-mcdougald-henry-long-2026-10-15","louis-park-pixie-woods-2026-04-06","stanislaus-street-corridor-2026-04-06","highway-4-corridor-2026-04-06"],"published":true,"related_finding_ids":["finding-public-street-dog-information-fragmented"]},"dateForSort":{"field":"date","value":"2026-10-30"}},"caring-for-stocktons-dogs":{"id":"caring-for-stocktons-dogs","schema":"article","typeName":"Article","title":"What if caring for Stockton's dogs were as easy as going to the park?","description":"Stockton's shelter is expanding and Streetdogs has proposed a Canine Campus. What would make everyday participation in dog care easier?","fields":{"id":"caring-for-stocktons-dogs","title":"What if caring for Stockton's dogs were as easy as going to the park?","description":"An investigation into existing dog-care services, proposed facilities, and how more people might participate in caring for Stockton's dogs.","summary":"Stockton's shelter is expanding and Streetdogs has proposed a Canine Campus. What would make everyday participation in dog care easier?","date":"2026-10-30","type":"investigation","path":"/articles/caring-for-stocktons-dogs/","content":{"introduction":"Caring for Stockton's dogs already takes public workers, rescue groups, volunteers, and adopters. We are investigating what more could become possible if a welcoming place made it easier for ordinary people to help. This is a question about adding ways to care, alongside the essential services that already exist.","sections":[{"heading":"What exists: Stockton Animal Services","paragraphs":["Stockton Animal Services performs essential municipal work: responding to animal-control needs, taking animals into the shelter, caring for them, and helping them reach adoption or other outcomes. Its ongoing expansion is a positive development. City plans include treatment, isolation, rehabilitation, and public adoption space; we do not yet know how much additional usable capacity it will provide or how outcomes will change.","On October 14, Crossover visited the shelter at 1575 S. Lincoln Street, submitted a volunteer application, and spoke briefly with staff. We observed construction beside the entrance and a crowded public lobby during our visit. The entrance was difficult for us to find amid the work. The shelter sits in an industrial area, so we are also checking what transportation and walking options would make volunteer outings practical. These are observations from one visit, not a judgment about the shelter or its location. The expansion may address some of the limitations we saw."],"links":[{"label":"Crossover's October 14 visit report","display_label":"Animal Services visit report","url":"/reports/crossover-2026-10-14-sas-first-visit/"},{"label":"City of Stockton shelter expansion announcement","display_label":"City shelter expansion announcement","url":"https://cms3.revize.com/revize/stockton/Documents/Community/News%20%26%20Information/2024/November/News_2024_11_12_AnimalShelterRenovationProjectGroundbreaking.pdf"}]},{"heading":"What is proposed: the Canine Campus","paragraphs":["Stockton Streetdogs proposes a Canine Campus that could shelter hundreds of stray dogs at a time, provide overflow space for Stockton Animal Services, and include recovery space for spay and neuter procedures and for sick dogs. Its published proposal describes 24-hour staffing, coordination with rescues, selected volunteers, and opportunities for the public to visit and help. These are the organization's plans, not services operating today.","Streetdogs opened a construction fundraiser in July 2026. Fundraising is documented, but we have not verified full funding, a secured site, approvals, an opening date, or usable operating capacity. If built and staffed, the campus could complement the municipal shelter with more room for recovery, exercise, and care. We want to learn how its public participation plans would work in practice before assuming they would match the broader idea explored below."],"links":[{"label":"Stockton Streetdogs' Canine Campus proposal","display_label":"Street Dogs campus proposal","url":"https://streetdogsanctuary.com/canine-campus"},{"label":"Canine Campus construction fundraiser","display_label":"Canine Campus fundraiser","url":"https://www.gofundme.com/f/help-us-create-stocktons-canine-campus"}]},{"heading":"A different model: The Asher House","paragraphs":["Lee Asher's animal sanctuary in Oregon offers another model to study. The Asher House says it rescues and rehabilitates animals, places many for adoption, and gives others a lasting home. Animals have room for activity and enrichment; a staff team helps provide care. The nonprofit says donations and merchandise sales support animal care, while Lee purchased the land with personal income.","The Asher House is not currently open for public visits and says it does not yet have a volunteer program. Its animal-centered living environment, rehabilitation work, and adoption network are worth studying for Stockton. A public place where visitors regularly help care for dogs would be an additional local idea, not a description of how The Asher House operates today."],"links":[{"label":"The Asher House and its operating model","display_label":"Asher House operating model","url":"https://www.theasherhouse.com/pages/asher-house-faqs"}]},{"heading":"What if helping felt like going to the park?","paragraphs":["Here is Crossover's proposal to investigate: a welcoming dog-care place with easy parking, walking trails, open grounds, and comfortable spaces for animals. Someone could arrive, learn which dogs are ready for interaction, and take a suitable dog for a supervised walk. Others could help socialize dogs, assist with rehabilitation under trained guidance, or support daily care.","The goal is to make caring for dogs as accessible as visiting a public park. Access would still need appropriate screening, training, supervision, animal-behavior assessment, and safeguards for dogs and people. We do not yet know what site, staffing, costs, partnerships, and rules would make this workable in Stockton."]},{"heading":"More time for care","paragraphs":["AI and automation could help with scheduling, matching people to suitable tasks, keeping care records current, and coordinating transport and follow-up. Robotics may eventually help with repetitive physical chores. These are possibilities to test, not tools we have shown to work here. People and animal-care professionals would still make welfare and safety decisions.","If technology reduces the logistical burden, more human time could go toward walking, socializing, rehabilitating, and caring for living beings. That is part of Crossover's broader investigation into a future in which people can spend more of their lives on vocation rather than compulsory work. The immediate test is practical: can more dogs get good care, and can more people take part safely?"]},{"heading":"The question ahead","paragraphs":["We want to learn from Stockton Animal Services, Stockton Streetdogs, other rescuers, and residents: which roles are already open to the public, what barriers keep people from participating, and what extra space or support would genuinely help? The shelter expansion and the Canine Campus proposal are concrete developments to follow. The park-like care setting is a further possibility to examine with the people doing the work.","What would it take to make caring for Stockton's dogs as accessible as visiting a public park?"]}]},"related_gap_ids":["dogs-safe-placement"],"related_location_ids":["stockton-animal-services-shelter"],"published":true,"related_finding_ids":["finding-new-facilities-impact-uncertain"]},"dateForSort":{"field":"date","value":"2026-10-30"}},"where-are-stray-dogs":{"id":"where-are-stray-dogs","schema":"article","typeName":"Article","title":"Where are the stray dogs, and how many are there?","description":"Published estimates suggest hundreds of dogs may be on Stockton's streets. Where are they, and what can firsthand observations establish?","fields":{"id":"where-are-stray-dogs","title":"Where are the stray dogs, and how many are there?","description":"An ongoing investigation into the number and distribution of dogs on Stockton's streets, starting with published reports and two planned field investigations.","summary":"Published estimates suggest hundreds of dogs may be on Stockton's streets. Where are they, and what can firsthand observations establish?","date":"2026-10-31","type":"investigation","path":"/articles/where-are-stray-dogs/","content":{"introduction":"How many dogs are on Stockton's streets, and where are they? Published reports describe abandoned and roaming dogs, but no verified current citywide street-dog count has been established. Crossover is gathering evidence, checking specific areas, and documenting what we actually find. This article starts with what is known and will be updated as our investigation produces firsthand reports.","sections":[{"heading":"What the published reports tell us","paragraphs":["In an April 6, 2026 CBS Sacramento report, Stockton Street Dogs founder Jesse Mejia estimated that at least 200 to 300 dogs were on Stockton's streets at a given time, potentially rising to 400 during puppy season. Those figures are Mejia's estimates, not an independently verified census. The report and accompanying television coverage are useful leads, but they cannot establish current dog locations or numbers.","Stockton Animal Services recorded 3,106 stray dog intake events in 2024 across its broader multi-jurisdiction service area. Intake events over a year are not a count of dogs currently on Stockton's streets, and cannot be directly compared with the advocate's point-in-time estimate."],"links":[{"label":"CBS Sacramento: abandoned dogs in Stockton (April 6, 2026)","display_label":"CBS abandoned-dog report","url":"https://www.cbsnews.com/sacramento/news/stockton-dumping-ground-abandoned-dogs/"},{"label":"CBS Sacramento: television report","display_label":"CBS shelter interview video","url":"https://www.cbsnews.com/sacramento/video/animal-shelters-speak-out-on-abandoned-dog-problem-in-stockton/"},{"label":"Investigation question: Where are the stray dogs, and how many are there?","display_label":"Stray-dog investigation question","url":"/reality/too-many-dogs-still-lack-safe-placement/#question-where-dogs-need-help"},{"label":"Current findings","url":"/work/dogs/findings/"}]},{"heading":"First investigation area: St. Mary's–Church Street corridor","paragraphs":["CBS Sacramento reported on June 8, 2026 that Stockton Street Dogs distributed about 200 pounds of food to around 70 dogs during an outreach visit at a Church Street encampment near St. Mary's Community Services. This describes a particular reported event, not the number of dogs currently living in the area. It does not place the dogs at the community-services campus itself.","Crossover plans an initial observation on Monday, November 2, 2026, of a manageable portion of public areas in the St. Mary's–Church Street corridor. We will record the date, general area examined, approximate number of visible dogs (including zero), observed circumstances, and limitations. No Crossover field observation of this corridor is claimed yet. Dogs with unhoused people must not automatically be described as abandoned."],"links":[{"label":"CBS Sacramento: Church Street outreach report (June 8, 2026)","display_label":"CBS Church Street report","url":"https://www.cbsnews.com/sacramento/news/stockton-dog-rescue-to-implement-safe-temporary-campground-homeless-residents/"},{"label":"Planned St. Mary's corridor field task","display_label":"St. Mary’s field task","url":"/work/dogs/tasks/#task-verify-st-marys-church-street-dog-scale"},{"label":"St. Mary's–Church Street corridor location record","display_label":"St. Mary’s corridor location","url":"/work/dogs/map/#st-marys-church-street-corridor"}]},{"heading":"Second investigation area: Carrie Street levee and South Stockton / District 5","paragraphs":["The Carrie Street levee near Weston Ranch is a separate location lead, associated with a reported April 2026 roaming-dog incident. September reporting separately described increased stray- and dumped-dog encounters across District 5, but did not identify Carrie Street as the location of those encounters. These reports are not evidence of how many dogs are there now.","Crossover plans to select a safe public observation route, examine conditions firsthand, and document its observations—including zero dogs if none are found. This visit has not yet happened. We will not treat a historical report as a current location or publish precise sensitive animal or resident locations."],"links":[{"label":"Planned South Stockton / District 5 field task","display_label":"South Stockton field task","url":"/work/dogs/tasks/#task-verify-south-stockton-district-5-reports"},{"label":"Carrie Street levee / Weston Ranch location record","display_label":"Carrie Street levee location","url":"/work/dogs/map/#weston-ranch-carrie-street"},{"label":"Stocktonia: Carrie Street incident report (May 11, 2026)","display_label":"Stocktonia Carrie Street report","url":"https://stocktonia.org/news/public-safety/2026/05/11/stockton-woman-mauled-wild-dogs/"},{"label":"KCRA 3: District 5 reporting (September 24, 2026)","display_label":"KCRA District 5 report","url":"https://www.kcra.com/article/stockton-advocates-seek-support-for-stray-dogs/73877921"}]},{"heading":"What remains unknown","paragraphs":["We do not yet have a verified current citywide population estimate or a reliable map of where dogs are present. Reports concern different dates, areas, and kinds of observations, and dogs seen roaming may be owned, lost, abandoned, or living with people. These categories cannot be inferred from appearance or location alone.","Even visits to two areas will not constitute a citywide census. They can establish limited, dated firsthand observations that help us test published leads and plan a better investigation."]},{"heading":"Follow the investigation","paragraphs":["This is an ongoing article, not a completed conclusion. The St. Mary's corridor and South Stockton / District 5 tasks are currently planned; their field observations are not yet available. When firsthand reports are completed, we will add dated results, sources, limitations, and any resulting changes to our findings. New evidence may change our questions and where we investigate next.","The number and location of Stockton's street dogs remain unknown. That's precisely why we're going to look."],"links":[{"label":"Current Crossover tasks","url":"/work/dogs/tasks/"},{"label":"Investigation activity","url":" <section class="section" id="inv-actions"><div class="sectionhead"><h2>Next actions</h2><span class="tiny">${open.length} open · ${waiting.length} waiting · ${done.length} completed</span></div><p class="inv-section-intro">Planned work is not an observation. Completed steps are documented separately in Activity.</p><div class="inv-work-list">${[...open,...waiting].map(invTask).join('')||'<p class="quiet">No outstanding actions recorded.</p>'}</div></section>
<section class="section" id="inv-activity"><div class="sectionhead"><h2>What we've actually done</h2><button class="smalllink" data-nav="Activity">All activity →</button></div>${recent.map(r=>{let z=f(r);return `<div class="inv-activity"><div class="inv-date">${esc(date(z.occurred_at))}</div><div><a class="inv-link" href="${route(r.id)}">${esc(title(r))}</a><p>${esc(z.summary||r.description||'')}</p>${z.outcome?`<div class="inv-outcome">Outcome: ${esc(z.outcome.summary||lbl(z.outcome.status))}</div>`:''}</div></div>`}).join('')}</section>
<section class="section" id="inv-findings"><div class="sectionhead"><h2>Current findings</h2><button class="smalllink" data-nav="Findings">All findings →</button></div><p class="inv-section-intro">What evidence currently suggests—not conclusions beyond the available record.</p>${findings.map(r=>{let z=f(r);return `<article class="inv-finding"><div class="inv-finding-top"><span class="status ${esc(z.status||'')}">${esc(lbl(z.status||''))}</span></div><h3><a href="${route(r.id)}">${esc(title(r))}</a></h3><p>${esc(z.statement||'')}</p>${z.limitations?`<p class="inv-limitation"><strong>Limit:</strong> ${esc(trunc(z.limitations,280))}</p>`:''}</article>`}).join('')}</section>
<section class="section" id="inv-evidence"><div class="sectionhead"><h2>Evidence and open questions</h2><button class="smalllink" data-nav="Explore">Explore all records →</button></div><p class="inv-section-intro">Reports are leads, not confirmed street counts. The investigation connects public records, firsthand attempts, and findings without treating them as equivalent.</p><div class="inv-evidence-grid"><div><h3>Evidence to examine</h3>${(x.evidence_record_ids||[]).slice(0,7).map(id=>get(id)).filter(Boolean).map(r=>`<a class="inv-evidence-link" href="${route(r.id)}">${esc(title(r))}</a>`).join('')||'<p class="quiet">No evidence linked.</p>'}</div><div><h3>Still unknown</h3>${(f(need||{}).unknown_questions||[]).slice(0,7).map(q=>`<p class="inv-unknown">${esc(q)}</p>`).join('')||'<p class="quiet">No unresolved questions listed.</p>'}</div></div></section>`}
function activity(){return header('Activity','What we actually did','Firsthand attempts, follow-ups, and documented outcomes—not a claim that care was delivered.')+`<section class="section">${by('activity').sort((a,b)=>String(f(b).occurred_at).localeCompare(String(f(a).occurred_at))).map(r=>`<div class="feedrow"><span class="date">${date(f(r).occurred_at)}</span><div><a class="ftitle" href="${route(r.id)}">${esc(title(r))}</a><p>${esc(f(r).summary)}</p>${f(r).outcome?`<div class="meta">Outcome: ${esc(lbl(f(r).outcome.status))}</div>`:''}</div><span class="sidepill">Firsthand</span></div>`).join('')}</section>`}
function findings(){return header('Findings','What does the evidence support?','Preliminary findings, with supporting records and explicit limitations.')+`<section class="section"><div class="grid">${by('finding').map(r=>recordCard(r,f(r).statement)).join('')}</div></section><section class="section"><div class="sectionhead"><h2>Published articles</h2><span class="tiny">${count('article')} articles</span></div><div class="rows">${by('article').map(r=>row(r)).join('')}</div></section>`}
function improvements(){return header('Improvements','What is being built or proposed?','Projects are shown with their stated stage and reported benefits. Proposed capacity is not the same as demonstrated outcomes.')+`<section class="section"><div class="grid">${by('project').map(r=>recordCard(r,f(r).description||f(r).intended_outcome)).join('')}</div></section><section class="section"><div class="sectionhead"><h2>Stories of care</h2><span class="tiny">${count('story')} stories</span></div><div class="rows">${by('story').map(r=>row(r)).join('')}</div></section>`}
function orgs(){return header('Organizations','Organizations connected to the work',`${contactedOrgs().length} contacted through documented Crossover activity. Other organizations are identified from research, not contacted.`)+`<section class="section"><div class="grid">${[...contactedOrgs(),...by('organization').filter(r=>!contactedOrgs().some(x=>x.id===r.id))].map(r=>recordCard(r)).join('')}</div></section>`}
const types=['all','need','investigation','objective','action','activity','finding','evidence','measurement','claim','project','story','organization','article','location'];
function exploreMatches(){return sortRecords(all.filter(r=>(currentFilter==='all'||r.schema===currentFilter)&&(!textQuery||(title(r)+' '+r.description+' '+JSON.stringify(f(r))).toLowerCase().includes(textQuery.toLowerCase()))),currentSort)}
function exploreRow(r){const d=r.dateForSort?.value;return `<div class="listrow"><div><div class="tiny">${esc(lbl(r.schema))}${d?` · ${esc(dateLabel(r))}: ${esc(date(d))}`:' · Undated'}</div><a href="${route(r.id)}">${esc(title(r))}</a><div class="sub">${esc(trunc(f(r).summary||f(r).statement||r.description||f(r).description,215))}</div></div>${statusFor(r)?`<span class="status ${esc(statusFor(r))}">${esc(lbl(statusFor(r)))}</span>`:''}</div>`}
function updateExploreResults(){let filtered=exploreMatches();let box=document.getElementById('explore-results');if(box)box.innerHTML=filtered.length?filtered.map(exploreRow).join(''):'<div class="noresult">No matching records.</div>';const total=document.getElementById('explore-count');if(total)total.textContent=`${filtered.length} of ${all.length} records`}
function explorer(){let filtered=exploreMatches();return header('Explore feed','One dataset. Many views.','Search all records or filter by type. Newest first uses each record’s dated source field; undated records appear last.')+`<div class="tools"><input class="search" id="search" type="search" placeholder="Search all records…" value="${esc(textQuery)}" aria-label="Search records"><select class="search" id="sort" aria-label="Sort records" style="width:auto;min-width:165px"><option value="newest" ${currentSort==='newest'?'selected':''}>Newest first</option><option value="oldest" ${currentSort==='oldest'?'selected':''}>Oldest first</option><option value="title" ${currentSort==='title'?'selected':''}>Title A–Z</option></select><span class="tiny" id="explore-count">${filtered.length} of ${all.length} records</span></div><div class="filters">${types.map(t=>`<button class="chip ${currentFilter===t?'active':''}" data-filter="${t}">${esc(lbl(t))}${t!=='all'?` <span style="opacity:.75">${count(t)}</span>`:''}</button>`).join('')}</div><div class="rows" id="explore-results">${filtered.length?filtered.map(exploreRow).join(''):'<div class="noresult">No matching records.</div>'}</div>`}

const keys=[['objective_ids','Objectives'],['task_ids','Planned actions'],['activity_record_ids','Activity'],['finding_ids','Findings'],['related_finding_ids','Related findings'],['supporting_record_ids','Supporting evidence'],['contradicting_record_ids','Contradicting records'],['evidence_record_ids','Evidence'],['basis_record_ids','Basis records'],['record_ids','Related records'],['report_record_ids','Reports'],['sourceRecordIds','Sources'],['organization_ids','Organizations'],['contact_activity_ids','Documented contact activity'],['location_ids','Locations'],['gap_ids','Related needs'],['related_gap_ids','Related needs'],['related_location_ids','Related locations'],['unknown_questions','Unknown questions'],['open_questions','Open questions']];
const single=[['investigation_id','Investigation'],['gap_id','Underlying need'],['primary_objective_id','Primary objective'],['needId','Related need'],['article_id','Related article'],['source_record_id','Source record']];
function relatedBack(id){let found=all.filter(r=>r.id!==id&&Object.entries(f(r)).some(([k,v])=>k.endsWith('_ids')&&Array.isArray(v)&&v.includes(id)||k.endsWith('_id')&&v===id));return found.slice(0,24)}
function detail(id){let r=get(id);if(!r)return header('Not found','Record not found','This identifier does not exist in the feed.');if(r.schema==='investigation')return investigation();let fs=f(r);let summary=fs.introduction||fs.summary||fs.statement||r.description||fs.description||fs.primary_goal||'';let done=new Set(['id','name','title','summary','description','statement','publicName','introduction','primary_goal','preferred_image','thumbnail_image','preferred_logo']);let content='';if(summary)content+=`<section class="detailblock"><h2>Overview</h2><p>${esc(summary)}</p></section>`;
if(r.schema==='investigation'&&fs.findings_summary)content+=`<section class="detailblock"><h2>Current picture</h2><p>${esc(fs.findings_summary)}</p><p class="tiny">This summary is from the uploaded feed; no independent verification added.</p></section>`;
if(r.schema==='finding'){if(fs.limitations)content+=`<section class="detailblock"><h2>Limitations</h2><p>${esc(Array.isArray(fs.limitations)?fs.limitations.join(' · '):fs.limitations)}</p></section>`;}
if(r.schema==='article'&&fs.content){let text=typeof fs.content==='string'?fs.content:JSON.stringify(fs.content,null,2);content+=`<section class="detailblock"><h2>Article</h2><div class="articlebody">${esc(text)}</div></section>`}
if(r.schema==='activity'&&fs.outcome)content+=`<section class="detailblock"><h2>Documented outcome</h2><p><span class="status">${esc(lbl(fs.outcome.status))}</span></p><p>${esc(fs.outcome.summary)}</p>${fs.outcome.as_of?`<div class="tiny">As of ${date(fs.outcome.as_of)}</div>`:''}</section>`;
if(r.schema==='project'){for(let k of ['intended_outcome','capacity_summary','expected_capacity_or_benefit','actual_additional_capacity','next_verification_step'])if(fs[k])content+=`<section class="detailblock"><h2>${esc(lbl(k))}</h2><p>${esc(typeof fs[k]==='object'?JSON.stringify(fs[k],null,2):fs[k])}</p></section>`}
if(r.schema==='measurement')content+=`<section class="detailblock"><h2>Recorded measurement</h2><p>${esc(fs.value)} ${esc(fs.unit||'')} ${esc(fs.measure||'')}</p>${fs.note?`<p>${esc(fs.note)}</p>`:''}</section>`;
if(r.schema==='claim'){for(let k of ['reportedValue','limitations','verificationStatus'])if(fs[k])content+=`<section class="detailblock"><h2>${esc(lbl(k))}</h2><p>${esc(typeof fs[k]==='object'?JSON.stringify(fs[k]):fs[k])}</p></section>`}
let qs=[...(fs.unknown_questions||[]),...(fs.open_questions||[])];if(qs.length)content+=`<section class="detailblock"><h2>Unresolved questions</h2>${qs.map(q=>`<p>• ${esc(q)}</p>`).join('')}</section>`;
if(r.schema==='objective'){content+=`<section class="detailblock"><h2>Related work</h2><p class="quiet">This line of inquiry connects planned actions, firsthand activity, public evidence and findings.</p>${[...new Set([...(fs.task_ids||[]),...(fs.activity_record_ids||[]),...(fs.finding_ids||[])])].filter(id=>get(id)).map(id=>`<div class="relation">${link(id)}<small>${esc(lbl(get(id).schema))}</small></div>`).join('')}</section>`}
if(!content)content=`<section class="detailblock"><h2>Record</h2><p>${esc(r.description||'Details are available in the linked fields and source feed.')}</p></section>`;
let rels='';for(let [k,label] of single){if(fs[k]&&get(fs[k]))rels+=rel([fs[k]],label)}for(let [k,label] of keys){if(Array.isArray(fs[k])&&k!=='unknown_questions'&&k!=='open_questions')rels+=rel(fs[k],label)}if(r.schema==='organization'&&fs.website)rels+=`<section class="detailblock"><h3>Website</h3><a class="relation" href="${esc(fs.website)}" target="_blank" rel="noopener noreferrer">${esc(fs.website)} ↗</a></section>`;
let backs=relatedBack(id);if(backs.length)rels+=`<section class="detailblock"><h3>Also referenced by</h3>${backs.map(x=>`<div class="relation">${link(x.id)}<small>${esc(lbl(x.schema))}</small></div>`).join('')}</section>`;
let meta=[statusFor(r),fs.evidence_status,fs.verification_status].filter(Boolean);return `<div class="breadcrumbs"><a href="#/">Home</a> / <a href="#/Explore">Explore feed</a> / ${esc(lbl(r.schema))}</div><header class="detailhead"><div class="eyebrow">${esc(lbl(r.schema))} ${meta.map(x=>`<span class="status ${esc(x)}">${esc(lbl(x))}</span>`).join(' ')}</div><h1>${esc(title(r))}</h1>${fs.occurred_at||fs.published_at||fs.updated_at?`<div class="meta">${date(fs.occurred_at||fs.published_at||fs.updated_at)}</div>`:''}</header><div class="detailgrid"><div>${content}<div class="note">Feed record: <code>${esc(id)}</code>. Linked evidence is not automatically proof of a claim.</div></div><aside class="side">${rels||'<div class="quiet">No linked records in this snapshot.</div>'}</aside></div>`}
function render(){let hash=decodeURIComponent(location.hash.slice(1)||'/'),parts=hash.split('/').filter(Boolean);activeSection=parts[0]||'Overview';nav();let app=document.getElementById('app');app.innerHTML=parts[0]==='record'?detail(parts.slice(1).join('/')):({'Overview':home,'Needs':needs,'Investigations':investigation,'Activity':activity,'Findings':findings,'Improvements':improvements,'Organizations':orgs,'Explore':explorer}[activeSection]||home)();if(parts[0]!=='Explore')textQuery='';window.scrollTo(0,0)}
document.addEventListener('click',e=>{let jump=e.target.closest('[data-scroll]');if(jump){e.preventDefault();document.getElementById(jump.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}let navbtn=e.target.closest('[data-nav]');if(navbtn){location.hash='#/'+navbtn.dataset.nav;return}let b=e.target.closest('[data-filter]');if(b){currentFilter=b.dataset.filter;let cur=document.getElementById('search');if(cur)textQuery=cur.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){textQuery=e.target.value;updateExploreResults()}});document.addEventListener('change',e=>{if(e.target.id==='sort'){currentSort=e.target.value;updateExploreResults()}});window.addEventListener('hashchange',render);render();
</script></body></html>
