name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install offline speech renderer
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Cache generated narration
        uses: actions/cache@v4
        with:
          path: public/audio
          key: feed-audio-${{ hashFiles('public/feed.json') }}
          restore-keys: feed-audio-

      - name: Build
        run: npm run build

      - name: Verify committed public feed
        run: git diff --exit-code -- public/data/records.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
