<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142e4b">
  <meta name="description" content="Track Stockton's routes to care for street dogs, the tasks behind them, and the evidence collected along the way.">
  <link rel="icon" href="/assets/crossover.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/touch.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Crossover">
  <link rel="preload" href="/assets/plex-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/plex-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <title>Pathways · Crossover Stockton</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <div class="mast">
    <header class="shell topbar">
      <a class="brand" href="#pathways" aria-label="Crossover Stockton home"><img src="/assets/crossover.svg" width="39" height="39" alt=""><span>Crossover</span></a>
      <nav id="main-nav" aria-label="Workspace sections"></nav>
      <div class="site-actions">
        <button id="find" class="icon-button search-launch" aria-label="Search all sections" title="Search all sections (/)"></button>
        <button id="chapter" class="chapter-button" aria-label="Current chapter, Stockton, California"></button>
      </div>
    </header>
  </div>
  <main id="main" class="shell main" tabindex="-1">
    <div id="page"><h1 class="loading-title">Pathway tracker</h1><p role="status">Loading Stockton’s tracker…</p></div>
  </main>
  <footer class="shell site-footer">
    <span class="footer-brand"><img src="/assets/crossover.svg" width="22" height="22" alt="">Crossover Stockton</span>
    <div><button data-overlay="about">About &amp; methodology</button><a href="https://github.com/jeff-kolyer/crossover-stockton" target="_blank" rel="noopener">Source repository</a></div>
  </footer>
  <dialog id="panel" aria-labelledby="panel-title"><div id="panel-content"></div></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
  <noscript><p>This tracker uses JavaScript. <a href="https://github.com/jeff-kolyer/crossover-stockton">Read the source repository</a>.</p></noscript>
</body>
</html>
