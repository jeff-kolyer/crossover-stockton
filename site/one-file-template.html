  <script>
  (()=>{
    "use strict";
    const feed=JSON.parse(document.getElementById("feed-data").textContent);

    const records=feed.records,all=Object.values(records),identity=records["crossover-stockton"],founder=all.find(r=>r.schema==="person"&&r.fields?.profileUrl),investigations=all.filter(r=>r.schema==="investigation");
    const navItems=[["/","Home"],["/needs","Needs"],["/investigation","Investigation"],["/activity","Activity"],["/responses","Responses"],["/organizations","Organizations"],["/places","Places"],["/explore","Explore"],["/about","About"]];
    const relationKeys={founderPersonId:"Founder",principleIds:"Principles",methodIds:"Methods",investigation_id:"Investigation",gap_id:"Need",gap_ids:"Needs",needId:"Need",objective_ids:"Questions",action_ids:"Actions",activity_record_ids:"Activity",finding_ids:"Findings",verified_finding_ids:"Verified findings",supporting_record_ids:"Supporting evidence",contradicting_record_ids:"Contradicting evidence",evidence_record_id:"Evidence",evidence_record_ids:"Evidence",basis_record_ids:"Basis records",record_ids:"Related records",report_record_ids:"Reports",sourceRecordIds:"Sources",source_record_id:"Source",organization_ids:"Organizations",contact_activity_ids:"Documented contact",map_location_id:"Place",location_ids:"Locations",map_reference_location_ids:"Nearby geographic references",related_location_ids:"Related locations",related_gap_ids:"Related needs",related_objective_ids:"Related questions",article_id:"Article",primary_objective_id:"Primary question",measurementId:"Measurement",source_record_ids:"Sources"};
    let exploreQuery="",exploreType="all",exploreSort="newest";
    const f=r=>r?.fields||{},by=s=>all.filter(r=>r.schema===s),get=id=>records[id],esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]),clean=v=>String(v??"").trim(),label=v=>clean(v).replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase()),dateLabel=field=>feed.fieldInfo?.[field]?.label||label(field),trunc=(v,n=180)=>{let s=clean(v);return s.length>n?s.slice(0,n-1).trimEnd()+"…":s};
    const pageHref=path=>`?page=${encodeURIComponent(path.replace(/^\//,""))}`,route=id=>pageHref(`/${get(id)?.schema==="organization"?"organization":"record"}/${encodeURIComponent(id)}`),safeUrl=u=>{try{let x=new URL(u);return ["https:","http:"].includes(x.protocol)?x.href:null}catch{return null}},img=p=>assets[p]||null;
    const date=v=>{if(!v)return "";const raw=clean(v),day=raw.slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return raw;const d=new Date(day+"T12:00:00");return Number.isNaN(d.getTime())?raw:new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric"}).format(d)};

    const text=r=>f(r).summary||f(r).statement||f(r).introduction||f(r).description||r.description||"";
    const recordLink=(r,copy)=>`<a href="${route(r.id)}">${esc(copy||r.title)}</a>`;
    const recordPill=r=>{const value=status(r);if(!value)return "";const tone=["investigating","in_progress","operational"].includes(value)?"dark":"";if(r.schema==="need"&&value==="investigating"&&by("investigation").some(inv=>f(inv).gap_id===r.id))return `<a class="pill ${tone}" href="${pageHref("/investigation")}" aria-label="View investigation for ${esc(r.title)}">Investigating →</a>`;return `<span class="pill ${tone}">${esc(label(value))}</span>`};

    const mapEmbed=r=>{const m=f(r).map_reference;if(!m?.verified||m.precision!=="address")return "";try{const u=new URL(m.embed_url);if(u.protocol!=="https:"||u.hostname!=="www.google.com"||u.pathname!=="/maps/embed"||!u.searchParams.has("pb"))return "";return `<iframe class="location-map" title="Map of ${esc(r.title)}" src="${esc(u.href)}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`}catch{return ""}};

    const card=r=>`<article class="card">${imageFor(r)?`<img class="card-image" src="${imageFor(r)}" alt="" loading="lazy">`:""}<div class="card-body"><div class="card-top"><span class="eyebrow">${esc(label(r.schema))}</span>${recordPill(r)}</div><h3>${recordLink(r)}</h3><p>${esc(trunc(text(r),170))}</p><div class="card-foot"><span>${r.dateForSort?`${esc(dateLabel(r.dateForSort.field))} · ${esc(date(r.dateForSort.value))}`:"Explore the record"}</span><a href="${route(r.id)}">Read more →</a></div></div></article>`;
    const sectionHead=(eyebrow,title,href,copy)=>`<div class="section-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2></div>${href?`<a class="text-link arrow" href="${href.startsWith("#/")?pageHref(href.slice(1)):href}">${esc(copy||"View all")}</a>`:""}</div>`;

    const organizationActivities=id=>sortRecent(by("activity").filter(r=>(f(r).organization_ids||[]).includes(id)));

    const organizationCard=r=>{const count=organizationActivities(r.id).length;return `<article class="card"><div class="card-body"><div class="card-top"><span class="pill ${count?"dark":""}">${count?"Contacted":"Identified"}</span></div><h3>${recordLink(r)}</h3><p>${esc(text(r))}</p><div class="card-foot"><span>${count?`${count} documented ${count===1?"activity":"activities"}`:"No contact documented"}</span><a href="${route(r.id)}">View organization →</a></div></div></article>`};
    const organizationsPage=()=>{const organizations=by("organization").sort((a,b)=>a.title.localeCompare(b.title)),contacted=organizations.filter(r=>contactedOrgIds.has(r.id)),activities=by("activity"),visited=new Set(activities.filter(r=>String(f(r).organization_interaction||"").startsWith("in_person_visit")).flatMap(r=>f(r).organization_ids||[])),participation=activities.filter(r=>f(r).participation_completed===true);return pageIntro("Community record","Organizations","Organizations in the public feed. Being identified here does not mean Crossover has contacted or partnered with them.","","organization-intro")+`<section class="section slim organization-metrics"><div class="wrap">${metricStrip([[organizations.length,"Organizations identified"],[contacted.length,"Organizations contacted"],[visited.size,"Locations visited"],[participation.length,"Participation pathways tested"]])}</div></section><section class="section"><div class="wrap">${sectionHead("Firsthand contact","Organizations contacted")}<p class="notice">Contacted means a Crossover activity record documents outreach, a visit, or a response. It does not imply a partnership or endorsement.</p><div class="grid two organization-list" style="margin-top:24px">${contacted.map(organizationCard).join("")}</div></div></section><section class="section"><div class="wrap">${sectionHead("Public record","Organizations identified")}<p class="notice">All ${organizations.length} organizations documented in the feed appear here. Contact status is shown separately on each record.</p><div class="grid organization-list" style="margin-top:24px">${organizations.map(organizationCard).join("")}</div></div></section>`};
    const organizationPage=id=>{const r=get(id);if(r?.schema!=="organization")return pageIntro("Organization","Organization unavailable","That organization is not in the public feed.");const refs=organizationRefs(id),activities=organizationActivities(id),needs=refs.filter(x=>x.schema==="need"),investigations=by("investigation").filter(x=>refs.some(ref=>f(ref).investigation_id===x.id)),responses=refs.filter(x=>["project","story"].includes(x.schema)),evidence=refs.filter(x=>x.schema==="evidence"),website=safeUrl(f(r).website),place=get(f(r).map_location_id);const linked=(items,empty)=>items.length?`<div class="stack">${items.map(x=>`<p>${recordLink(x)}${text(x)?` — ${esc(trunc(text(x),170))}`:""}</p>`).join("")}</div>`:`<p>${esc(empty)}</p>`;return `<div class="wrap breadcrumbs"><a href="#/">Home</a> / <a href="#/organizations">Organizations</a> / ${esc(r.title)}</div>${pageIntro("Organization",r.title,text(r),activities.length?"Documented Crossover contact":"Identified in the public feed")}<section class="section slim"><div class="wrap detail-grid"><div><div class="detail-section"><h2>What they do</h2><p>${esc(text(r))}</p></div><div class="detail-section"><h2>Related needs</h2>${linked(needs,"No specific need is directly linked in the feed.")}</div><div class="detail-section"><h2>Investigation connections</h2>${linked(investigations,"No investigation record directly links this organization yet.")}</div><div class="detail-section"><h2>Related responses</h2>${linked(responses,"No project or story directly links this organization yet.")}</div>${place?.schema==="location"?`<div class="detail-section"><h2>Place</h2><div class="stack">${mapCard(place)}</div></div>`:""}<div class="detail-section"><h2>Documented Crossover contact</h2>${activities.length?`<div class="row-list">${activities.map(row).join("")}</div>`:"<p>No Crossover contact is documented in the public feed.</p>"}</div></div><aside class="detail-aside"><h3>Contact status</h3><p>${activities.length?`${activities.length} documented ${activities.length===1?"activity":"activities"}`:"Identified; no contact documented"}</p>${website?`<a class="btn secondary" href="${esc(website)}" target="_blank" rel="noopener noreferrer">Organization website ↗</a>`:""}${evidence.length?`<h3>Related evidence</h3>${evidence.slice(0,8).map(x=>recordLink(x)).join("")}`:""}<h3>Public record</h3><a href="#/record/${encodeURIComponent(r.id)}">View all feed fields →</a></aside></div></section>`};
    const linkedIn=()=>safeUrl(f(founder).profileUrl);
    const home=()=>{const inv=investigations[0],need=get(f(inv).gap_id),recent=sortRecent(by("activity")).slice(0,4),places=by("location").filter(r=>f(r).location_type==="animal_care"||f(r).location_type==="human_services").slice(0,2),hero=img("/images/home/home-hero-wide.jpg");return `<section class="hero">${hero?`<img class="hero-image" src="${hero}" alt="" fetchpriority="high">`:""}<div class="wrap hero-inner"><div class="hero-copy"><div class="eyebrow">Stockton, California · An independent investigation</div><h1>See clearly.<br>Act locally.</h1><p>${esc(f(identity).purpose||"Investigating real needs and practical ways to respond.")}</p><div class="hero-actions"><a class="btn light" href="#/investigation">Explore the investigation →</a><a class="btn secondary" style="color:white;border-color:rgba(255,255,255,.65)" href="#/needs">See the needs</a></div></div></div><div class="hero-bottom"><div class="wrap hero-bottom-inner"><span>Evidence, firsthand work, and open questions in one public record.</span><a href="#/explore">Browse the full feed ↗</a></div></div></section><section class="section"><div class="wrap"><div class="intro-grid"><div><div class="eyebrow">What Crossover does</div><p class="intro-lede">${esc(f(identity).slogan||"See clearly. Act locally.")}</p></div><p class="intro-copy">${esc(f(identity).purpose||"")}</p></div>${metricStrip([[by("need").length,"Needs identified"],[by("investigation").length,"Active investigations"],[by("finding").length,"Findings recorded"],[by("location").length,"Places documented"]])}</div></section><section class="section feature"><div class="wrap feature-grid"><div><div class="eyebrow">Current focus</div><h2>${esc(f(inv).publicName||inv?.title||"Our investigation")}</h2><p>${esc(trunc(f(inv).introduction||inv?.description,340))}</p><div class="feature-actions"><a class="btn" href="#/investigation">Follow the investigation →</a>${need?`<a class="btn secondary" href="${route(need.id)}">Underlying need</a>`:""}</div></div><div class="feature-panel"><div class="eyebrow" style="color:#efb993">What we know so far</div><h3>${esc(trunc(f(inv).findings_summary,190))}</h3><div class="mini-list">${by("objective").filter(r=>f(r).investigation_id===inv?.id).slice(0,4).map(r=>`<a href="${route(r.id)}">${esc(r.title)} →</a>`).join("")}</div></div></div></section><section class="section"><div class="wrap">${sectionHead("Where we can help","Needs in focus","#/needs","Explore needs")}<div class="grid">${by("need").slice(0,3).map(card).join("")}</div></div></section><section class="section"><div class="wrap">${sectionHead("Firsthand record","Recent activity","#/activity","See activity")}<div class="row-list">${recent.map(row).join("")}</div></div></section><section class="section"><div class="wrap">${sectionHead("On the ground","Places connected to the work","#/places","Explore places")}<div class="grid two">${places.map(mapCard).join("")}</div></div></section>`};

    document.getElementById("header-logo").src=img("/images/logo_dark.webp")||"";document.getElementById("footer-logo").src=img(f(identity).preferred_logo)||img("/images/logo_light.webp")||"";document.getElementById("footer-purpose").textContent=f(identity).purpose||"";document.getElementById("record-count").textContent=all.length;const profile=linkedIn();if(profile)document.getElementById("header-linkedin").href=profile;else document.getElementById("header-linkedin").remove();document.getElementById("menu-toggle").addEventListener("click",()=>{const nav=document.getElementById("site-nav");nav.classList.toggle("open");document.getElementById("menu-toggle").setAttribute("aria-expanded",String(nav.classList.contains("open")))});document.addEventListener("click",e=>{const jump=e.target.closest('a[href^="#"]');const id=jump?.getAttribute("href")?.slice(1);if(["questions","next-actions","fieldwork","findings","locations","evidence"].includes(id)){e.preventDefault();document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"})}});document.addEventListener("input",e=>{if(e.target.id==="explore-search"){exploreQuery=e.target.value;updateExplore()}});document.addEventListener("change",e=>{if(e.target.id==="explore-type"){exploreType=e.target.value;updateExplore()}else if(e.target.id==="explore-sort"){exploreSort=e.target.value;updateExplore()}});window.addEventListener("hashchange",render);render();
  })();
  </script>
