    const needIcon=name=>{const paths={folder:'<path d="M3 5h7l2 2h9v12H3z"/>',overview:'<path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/>',picture:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',numbers:'<path d="M4 20V11h4v9M10 20V4h4v16M16 20v-8h4v8M2 21h20"/>',questions:'<circle cx="11" cy="13" r="8"/><circle cx="11" cy="13" r="4"/><path d="m11 13 9-9m-5 0h5v5"/>',actions:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 12 2.5 2.5L16 9"/>',activity:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',reports:'<path d="M6 2h8l4 4v16H6zM14 2v5h4M9 12h6M9 16h6"/>',places:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',organizations:'<circle cx="9" cy="8" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2M17 5a3 3 0 0 1 0 6M18 14a6 6 0 0 1 4 6"/>',projects:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/>',findings:'<path d="M9 18h6M10 21h4M8 15a7 7 0 1 1 8 0l-1 3H9z"/>',stories:'<path d="M3 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3zM21 4h-5a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h5z"/>',articles:'<path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h6"/>',sources:'<path d="M3 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3zM21 4h-5a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h5z"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.sources}</svg>`};
    const needHref=(id,view="overview")=>{const gap=get(id);return gap?.schema==="gap"?pageHref(`/gaps/${encodeURIComponent(f(gap).slug)}/${view}`):pageHref("/gaps")};
    const needRecords=(id,schema)=>by(schema).filter(r=>(f(r).gap_ids||f(r).related_gap_ids||[]).includes(id));
    const needLine=(r,extra="")=>`<div class="need-row"><span class="need-row-meta">${r.dateForSort?esc(date(r.dateForSort.value)):esc(label(r.schema))}</span><div><strong><a href="${route(r.id)}">${esc(r.title)}</a></strong><p>${esc(trunc(text(r),230))}</p></div><span class="need-row-meta">${esc(extra)}</span></div>`;
    const needList=(items,empty="No records yet for this gap.")=>items.length?`<div class="need-list">${items.map(r=>needLine(r)).join("")}</div>`:`<p class="need-note">${esc(empty)}</p>`;
    const needSources=fs=>{const links=(fs.sources||[]).filter(source=>safeUrl(source.url));return links.length?`<div class="need-panel" style="margin-top:20px"><details><summary>Sources for this overview</summary><ul>${links.map(source=>`<li><a class="need-inline-link" href="${esc(safeUrl(source.url))}" target="_blank" rel="noopener noreferrer">${esc(source.title||source.publisher||"Source")}</a>${source.publisher?` · ${esc(source.publisher)}`:""}</li>`).join("")}</ul></details></div>`:""};
    const taskRow=r=>{const item=f(r),events=(item.activity_record_ids||[]).map(get).filter(Boolean);return `<article class="need-task-row"><div><strong><a href="${route(r.id)}">${esc(r.title)}</a></strong>${item.list_context?`<p>${esc(item.list_context)}</p>`:""}${events.length?`<div class="need-task-events">Recorded work: ${events.map(event=>recordLink(event)).join(" · ")}</div>`:""}</div><span class="need-task-state">${item.completed_at?`Done · ${esc(date(item.completed_at))}`:esc(label(item.status||"Open"))}</span></article>`};
    const needOverview=(need,objectives)=>{
      const receipt=get("crossover-2026-11-02-sas-field-call-records-received")||by("activity").find(r=>r.title.startsWith("Received Stockton Animal Services field-call records"));
      const onboarding=get("finding-volunteer-onboarding-can-stall");
      const visit=get("crossover-2026-10-14-sas-volunteer-application");
      const intake=get("sas-2024-dog-intake-stray");
      const updates=[
        receipt&&{record:receipt,icon:"reports",kind:"Activity",detail:"Source received",date:f(receipt).outcome?.as_of||f(receipt).recorded_at,summary:"Animal Services emailed 7,183 field-call records. Review and analysis are underway."},
        onboarding&&{record:onboarding,icon:"findings",kind:"Finding",detail:"Preliminary",date:f(onboarding).last_reviewed_at,summary:"Two volunteer applications have not yet led to documented completed onboarding."},
        visit&&{record:visit,icon:"places",kind:"Field activity",detail:"",date:f(visit).recorded_at,summary:"Visited Stockton Animal Services, applied to volunteer, and documented firsthand observations."}
      ].filter(Boolean);
      const paw='<svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="7" cy="11" rx="2.4" ry="3.4" transform="rotate(-24 7 11)"/><ellipse cx="13" cy="7" rx="2.4" ry="3.4" transform="rotate(-8 13 7)"/><ellipse cx="20" cy="7" rx="2.4" ry="3.4" transform="rotate(8 20 7)"/><ellipse cx="26" cy="11" rx="2.4" ry="3.4" transform="rotate(24 26 11)"/><path d="M16.5 14c-3.4 0-5.1 3.1-7.9 6.6-2.1 2.7-1.2 6.4 2.4 6.4 2.1 0 3.4-1.3 5.5-1.3s3.4 1.3 5.5 1.3c3.6 0 4.5-3.7 2.4-6.4-2.8-3.5-4.5-6.6-7.9-6.6Z"/></svg>';
      return `<div class="overview-snapshot"><div class="overview-snapshot-heading">${paw}<h2>The current picture</h2></div><p>Shelter capacity pressure is documented. The number of street dogs and individual outcomes remain unknown.</p></div><div class="overview-stat-grid"><a href="${needHref(need.id,"metrics")}"><strong>${intake?Number(f(intake).value).toLocaleString():"—"}</strong><span>Stray intake events (2024)</span></a><a href="${needHref(need.id,"sources")}"><strong>${all.length.toLocaleString()}</strong><span>Public feed records</span></a><a href="${needHref(need.id,"objectives")}"><strong>${objectives.length}</strong><span>Objectives</span></a></div><div class="overview-lower"><section class="overview-updates"><div class="overview-section-heading"><h2>Latest updates</h2><a href="${needHref(need.id,"activity")}">Activity ${arrow}</a></div><div class="overview-update-list">${updates.map(({record,icon,kind,detail,date:when,summary})=>`<article class="overview-update"><span class="overview-update-icon ${icon}">${needIcon(icon)}</span><div><h3><a href="${route(record.id)}">${esc(record.title.replace(/\.$/,""))}</a></h3><p>${esc(summary)}</p><div class="overview-tags"><span class="overview-tag ${icon}">${esc(kind)}</span>${detail?`<span class="overview-tag">${esc(detail)}</span>`:""}</div></div><time datetime="${esc(when||"")}">${when?esc(date(when)):""}</time></article>`).join("")}</div></section><section class="overview-objectives"><div class="overview-objectives-heading">${needIcon("questions")}<h2>What we’re working to establish</h2></div><ul>${objectives.map(objective=>`<li><a href="${needHref(need.id,"objectives")}">${esc(objective.title)}</a></li>`).join("")}</ul></section></div><details class="overview-evidence"><summary>What the public record shows</summary><ul>${(f(need).what_we_are_seeing||[]).map(point=>`<li>${esc(point)}</li>`).join("")}</ul></details>${needSources(f(need))}`;
    };
    const needView=(need,view)=>{
      const id=need.id,fs=f(need),tasks=needRecords(id,"task").sort((a,b)=>(f(a).order_by_id||99)-(f(b).order_by_id||99)),activities=sortRecent(needRecords(id,"activity")),evidence=sortRecent(needRecords(id,"evidence")),objectives=by("objective").filter(r=>(f(r).gap_ids||[]).includes(id)),findings=needRecords(id,"finding"),places=needRecords(id,"location"),initiatives=needRecords(id,"initiative"),orgs=by("organization").filter(r=>(fs.organization_ids||[]).includes(r.id)),measurements=needRecords(id,"measurement"),claims=by("claim").filter(r=>f(r).gap_id===id);
      if(view==="overview")return needOverview(need,objectives);
      if(view==="objectives")return objectives.length?`<div class="need-objective-list">${objectives.map((objective,index)=>{const item=f(objective),relatedQuestions=item.guiding_questions||[],relatedMetrics=(item.measurement_ids||[]).map(get).filter(Boolean),relatedInitiatives=(item.initiative_ids||[]).map(get).filter(Boolean),relatedActivities=(item.activity_record_ids||[]).map(get).filter(Boolean),relatedFindings=(item.finding_ids||[]).map(get).filter(Boolean),relatedTasks=(item.task_ids||[]).map(get).filter(Boolean),relatedSources=[...new Set([...(item.evidence_record_ids||[]),...relatedMetrics.map(metric=>f(metric).source_record_id)])].map(get).filter(Boolean);const group=(title,items)=>items.length?`<div><h4>${esc(title)}</h4><div class="need-objective-links">${items.map(x=>recordLink(x)).join("")}</div></div>`:"";return `<article class="need-panel need-objective"><div class="need-objective-number">${index+1}</div><div><h2>${esc(objective.title)}</h2><p>${esc(item.description)}</p>${relatedQuestions.length?`<div class="need-objective-questions"><h3>Questions we are working through</h3><ul>${relatedQuestions.map(q=>`<li><strong>${esc(q.title)}</strong>${q.description?` — ${esc(q.description)}`:""}</li>`).join("")}</ul></div>`:""}<details><summary>Related work and evidence</summary><div class="need-objective-relations">${group("Metrics",relatedMetrics)}${group("Tasks",relatedTasks)}${group("Activity",relatedActivities)}${group("Findings",relatedFindings)}${group("Initiatives",relatedInitiatives)}${group("Sources",relatedSources)}</div></details></div></article>`}).join("")}</div>`:`<p class="need-note">No objectives have been recorded for this gap yet.</p>`;
      if(view==="metrics")return `<p class="need-note">These measurements describe shelter intake and outcomes. None is a count of dogs currently living on Stockton's streets.</p><div class="need-metric-grid">${measurements.map(r=>{const item=f(r),source=get(item.source_record_id);return `<div class="need-metric"><strong>${Number(item.value).toLocaleString()}</strong><span>${esc(label(item.measure||r.title))}</span><small>${esc(item.unit||"")} · ${esc(item.period_start||"")} to ${esc(item.period_end||"")}</small><small>${esc(item.coverage_id||"")} · ${esc(label(item.evidence_status||""))}</small>${item.note?`<p>${esc(item.note)}</p>`:""}${source?recordLink(source,"Source record"):""} ${recordLink(r,"Measurement details")}</div>`}).join("")}</div>${claims.length?`<div class="need-panel" style="margin-top:20px"><h3>Claims and uncertainty</h3>${claims.map(r=>needLine(r,f(r).verificationStatus||"")).join("")}</div>`:""}`;
      if(view==="activity"){const current=tasks.filter(r=>!["done","completed","cancelled"].includes(f(r).status)),completed=tasks.filter(r=>["done","completed"].includes(f(r).status)),reports=evidence.filter(r=>f(r).record_type==="field_report");return `<section class="need-panel" id="tasks"><h2>Tasks</h2><p>What Crossover plans to do and what has been completed. Completed tasks link to the dated record of what happened.</p><div class="need-task-group"><h3>To do and waiting</h3>${current.length?current.map(taskRow).join(""):`<p class="need-note">No current tasks.</p>`}</div><div class="need-task-group"><h3>Completed</h3>${completed.length?completed.map(taskRow).join(""):`<p class="need-note">No completed tasks yet.</p>`}</div></section><section class="need-panel" id="field-reports" style="margin-top:20px"><h2>Field reports</h2><p>Firsthand accounts from visits and observations.</p>${needList(reports,"No firsthand field report has been published for this gap yet.")}</section>`}
      if(view==="places")return `<p class="need-note">These are source-linked places and general areas. Each place has its own map reference; none establishes a current dog sighting or a verified hotspot.</p><div class="need-list">${places.map(r=>needLine(r,f(r).map_reference?.precision||"")).join("")}</div>`;
      if(view==="organizations")return needList(orgs);
      if(view==="initiatives")return `<p class="need-note">Initiatives include proposals, funded work, and operating programs. Expected benefit and demonstrated results are kept separate in each record.</p>${needList(initiatives)}`;
      if(view==="findings")return findings.length?`<div class="need-list">${findings.map(r=>{const item=f(r),support=(item.supporting_record_ids||[]).map(get).filter(Boolean),objectives=(item.objective_ids||[]).map(get).filter(Boolean),next=(item.related_task_ids||[]).map(get).filter(Boolean);return `<article class="need-panel" style="margin-bottom:20px"><h2><a href="${route(r.id)}">${esc(r.title)}</a></h2><p>${esc(item.statement||"")}</p>${item.limitations?`<p><strong>What this does not establish:</strong> ${esc(item.limitations)}</p>`:""}<p class="need-note">${support.length} supporting records · ${objectives.length} related objectives · ${next.length} related tasks</p>${support.length?`<div><strong>Supporting records</strong><div class="links">${support.map(x=>recordLink(x)).join(" · ")}</div></div>`:""}${objectives.length?`<div><strong>Objectives</strong><div class="links">${objectives.map(x=>recordLink(x)).join(" · ")}</div></div>`:""}${next.length?`<div><strong>Tasks</strong><div class="links">${next.map(x=>recordLink(x)).join(" · ")}</div></div>`:""}</article>`}).join("")}</div>`:`<p class="need-note">No findings have been published for this gap yet.</p>`;
                  if(view==="sources")return `<p class="need-note">${evidence.length} source records relate to this gap. Each record keeps attribution, dates, and limitations. <a class="need-inline-link" href="${pageHref("/explore")}">Search the full public feed ${arrow}</a></p>${needList(evidence)}`;
      return needView(need,"overview");
    };
    const workspaceSidebar=(project=defaultGap,selected="",current="")=>{
      const focus=project?.id,projectTitle=project?.title||"Gap",sections=focus?needViews.map(([key,title,,icon])=>`<a href="${needHref(focus,key)}" ${key===selected?'aria-current="page"':""}>${needIcon(icon)}<span>${esc(title)}</span></a>`).join(""):"";
      const globalLinks=[["/about","About","about"]];
      return `<nav class="need-sidebar" aria-label="Site sections"><div class="need-sidebar-brand-row"><a class="need-sidebar-brand" href="${focus?needHref(focus):pageHref("/")}" aria-label="${esc(projectTitle)} overview"><img src="${img("/images/logo_dark.webp")||""}" alt="" width="42" height="42"></a><a class="need-mobile-project-title" href="${focus?needHref(focus):pageHref("/")}">${esc(projectTitle)}</a><button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="false" aria-controls="need-section-links" aria-label="Open menu"><svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg><span>Menu</span></button></div><div class="need-section-links" id="need-section-links">${sections}<div class="need-sidebar-divider"></div>${globalLinks.map(([href,title,icon])=>`<a href="${pageHref(href)}" ${current===href?'aria-current="page"':""}>${needIcon(icon)}<span>${esc(title)}</span></a>`).join("")}</div></nav>`;
    };
    const needWorkspace=(need,view="overview")=>{if(!need||need.schema!=="gap")return pageIntro("","Gap unavailable","That gap is not in the public feed.");const project=need,selected=needViews.find(item=>item[0]===(view==="reports"?"activity":view))||needViews[0];return `<div class="need-workspace">${workspaceSidebar(project,selected[0])}<div class="need-main ${selected[0]==="overview"?"overview-page":""}"><div class="need-main-inner"><div class="need-view-header"><h1>${esc(selected[1])}</h1><p>${esc(selected[2])}</p></div>${needView(need,selected[0])}</div></div></div>`};
    const wrapSection=(html,current)=>`<div class="need-workspace">${workspaceSidebar(defaultGap,"",current)}<div class="need-main other-page">${html}</div></div>`;
    const gapsPage=()=>pageIntro("","Gaps","Choose a gap to follow its objectives, activity, findings, and sources.")+`<section class="section story-section"><div class="wrap"><div class="story-needs">${gaps.map(gap=>`<a class="story-need" href="${needHref(gap.id)}"><strong>${esc(gap.title)}</strong><span>${esc(f(gap).summary||"")}</span>${arrow}</a>`).join("")}</div></div></section>`;
    const path=()=>{try{const requested=new URLSearchParams(location.search).get("page"),p=requested?`/${decodeURIComponent(requested)}`:location.hash.startsWith("#/")?decodeURIComponent(location.hash.slice(1)):"/";return p.startsWith("/projects/street-dogs/")?p.replace("/projects/","/gaps/"):p.startsWith("/investigation")||p==="/action"||p==="/work"?"/":p==="/responses"||p==="/stories"||p==="/articles"||p==="/needs"||p==="/projects"?"/gaps":p}catch{return "/"}};
    const render=()=>{const current=path(),section=current.startsWith("/gaps/")?"/gaps":current.startsWith("/record/")?(["organization","task","activity"].includes(get(current.slice(8))?.schema)?"/activity":["initiative","gap"].includes(get(current.slice(8))?.schema)?"/gaps":get(current.slice(8))?.schema==="article"?"/gaps":(recordSection[get(current.slice(8))?.schema]||["/explore"])[0]):current.startsWith("/organization/")||["/organizations","/activity"].includes(current)?"/activity":current==="/articles"?"/gaps":current;document.getElementById("site-nav").innerHTML=navItems.map(([href,title])=>`<a href="${pageHref(href)}" ${section===href?'aria-current="page"':""}>${title}</a>`).join("");document.getElementById("footer-nav").innerHTML=navItems.slice(1).map(([href,title])=>`<a href="${pageHref(href)}">${title}</a>`).join("");const main=document.getElementById("main");main.innerHTML=current.startsWith("/organization/")?organizationPage(current.slice("/organization/".length)):current.startsWith("/gaps/")?needWorkspace(gaps.find(gap=>f(gap).slug===current.split("/")[2]),current.split("/")[3]||"overview"):current.startsWith("/record/")?recordPage(current.slice(8)):({"/":()=>needWorkspace(defaultGap),"/gaps":gapsPage,"/activity":activityPage,"/organizations":organizationsPage,"/places":placesPage,"/explore":explorePage,"/about":aboutPage}[current]||gapsPage)();if(!main.innerHTML.includes('class="need-workspace"'))main.innerHTML=wrapSection(main.innerHTML,current);if(current.startsWith("/record/")&&get(current.slice(8))?.schema!=="gap")main.insertAdjacentHTML("beforeend",`<section class="public-fields wrap"><details><summary>View all public feed fields</summary><pre>${esc(JSON.stringify(f(get(current.slice(8))),null,2))}</pre></details></section>`);if(current==="/explore")updateExplore();document.getElementById("site-nav").classList.remove("open");document.getElementById("menu-toggle").setAttribute("aria-expanded","false");window.scrollTo(0,0)};
    document.getElementById("header-logo").src=img("/images/logo_dark.webp")||"";document.getElementById("footer-logo").src=img(f(identity).preferred_logo)||img("/images/logo_light.webp")||"";document.getElementById("footer-purpose").textContent=f(identity).purpose||"";document.getElementById("record-count").textContent=all.length;const profile=linkedIn();if(profile)document.getElementById("header-linkedin").href=profile;else document.getElementById("header-linkedin").remove();document.getElementById("menu-toggle").addEventListener("click",()=>{const sidebar=document.querySelector(".need-sidebar"),open=sidebar?.classList.toggle("is-open")??false;document.getElementById("menu-toggle").setAttribute("aria-expanded",String(open))});document.addEventListener("click",e=>{const button=e.target?.closest?.("#sidebar-toggle");if(!button)return;const sidebar=button.closest(".need-sidebar"),open=sidebar.classList.toggle("is-open");button.setAttribute("aria-expanded",String(open));button.setAttribute("aria-label",open?"Close menu":"Open menu")});document.addEventListener("click",e=>{const jump=e.target.closest('a[href^="#"]');const id=jump?.getAttribute("href")?.slice(1);if(["questions","next-actions","fieldwork","findings","organizations","locations","evidence","articles"].includes(id)){e.preventDefault();document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"})}});document.addEventListener("input",e=>{if(e.target.id==="explore-search"){exploreQuery=e.target.value;updateExplore()}});document.addEventListener("change",e=>{if(e.target.id==="explore-type"){exploreType=e.target.value;updateExplore()}else if(e.target.id==="explore-sort"){exploreSort=e.target.value;updateExplore()}});window.addEventListener("hashchange",render);render();
  })();
