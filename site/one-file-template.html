    const needHref=(id,view="menu")=>{const gap=get(id);if(gap?.schema!=="gap")return pageHref("/");if(view==="menu")return pageHref("/");const exists=chapter("gap").chapters.some(item=>item.id===view);return exists?pageHref(`/${encodeURIComponent(f(gap).slug)}/${view}/`):pageHref("/")};
